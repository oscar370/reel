[package]
name = "reel"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
glycin = { version = "4.0.5", features = ["gdk4"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["gnome_47"] }
thiserror = "2.0.21"

[dependencies.adw]
package = "libadwaita"
version = "0.9.2"
features = ["v1_6"]

[dev-dependencies]
tempfile = "3"
